name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: SSH → build → reload PM2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/smartfinanace
            git checkout -- .
            git fetch --prune origin
            git reset --hard origin/main
            cd backend
            npm ci
            npm run build
            pm2 reload smartfinance-api || pm2 start dist/main.js --name smartfinance-api
            pm2 save
